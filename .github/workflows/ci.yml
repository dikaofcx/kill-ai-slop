name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.12.0', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (no runtime dependencies)
        run: npm ci
      - name: Validate generated files, manifests, links, and smoke tests
        run: npm run ci
      - name: Check whitespace errors
        run: git diff --check

  package:
    name: Packed CLI self-contained smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Build and test the CLI package
        run: |
          node scripts/sync-skills.mjs --check
          node cli/scripts/sync-assets.mjs
          (
            cd cli
            npm pack --pack-destination "$RUNNER_TEMP"
          )
          archive="$(ls "$RUNNER_TEMP"/kill-ai-slop-cli-*.tgz)"
          tar -tzf "$archive" > "$RUNNER_TEMP/archive-files.txt"
          grep -qx 'package/skills/kill-ai-slop/SKILL.md' "$RUNNER_TEMP/archive-files.txt"
          grep -qx 'package/rules/killslop.mdc' "$RUNNER_TEMP/archive-files.txt"
          mkdir -p "$RUNNER_TEMP/project"
          tar -xzf "$archive" -C "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          node package/index.mjs init --agent claude --dry-run
          node package/index.mjs init --agent claude
          test -f .claude/skills/kill-ai-slop/SKILL.md
  browser:
    name: Browser evaluation harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser evaluation fixture
        run: npm run test:browser
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evaluation
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
