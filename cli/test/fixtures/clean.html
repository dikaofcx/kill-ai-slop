<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture</title>
  <style>
    :root { --ink: #0b0b0f; --paper: #f7f6f3; --accent: #ff4d00; }
    body { font-family: 'Satoshi', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.55; }
    main { max-width: 65ch; padding: 48px 24px; }
    .stats { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .card { border: 1px solid var(--ink); border-radius: 2px; transition: border-color 200ms ease; }
    .btn:hover { box-shadow: 0 2px 8px rgba(11, 11, 15, 0.2); }
    .pill { border-radius: 999px; }
    .stack > * + * { margin-top: 16px; }
    .hero { background: linear-gradient(180deg, #f7f6f3, #e9e6df); }
  </style>
</head>
<body>
  <main>
    <h1>Cut invoice reconciliation from 4 hours to 12 minutes</h1>
    <p>Matches 9 of 10 bank lines automatically and flags the rest by amount and date.</p>
    <span>✓ Audit log</span>
  </main>
</body>
</html>
